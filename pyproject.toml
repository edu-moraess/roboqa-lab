[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roboqa-lab"
version = "0.1.0"
description = "Quality Assurance platform for sensor fusion and EKF state estimation"
authors = [{name = "ARQTECH LABS"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "hypothesis>=6.80", "ruff>=0.1", "coverage>=7.0"]
ml = ["scikit-learn>=1.3"]
ui = ["streamlit>=1.28", "plotly>=5.15", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["roboqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.coverage.run]
source = ["roboqa"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
